<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sieveworks — native worker</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="wrap">
      <header>
        <h1>Sieveworks <span class="tag">native worker</span></h1>
        <p class="sub">Same protocol as the browser worker — but the compute runs on your machine's CPU (and, soon, GPU).</p>
      </header>

      <section class="card">
        <div class="row">
          <label>Coordinator</label>
          <input id="coordinator" value="https://sieveworks-coordinator.fly.dev" spellcheck="false" />
        </div>
        <div class="row">
          <label>Job ID</label>
          <input id="job" placeholder="paste a job uuid" spellcheck="false" />
        </div>
        <div class="row">
          <label>Worker</label>
          <span id="wallet" class="mono dim">generating…</span>
        </div>
        <div class="row">
          <label>Core</label>
          <span id="core" class="mono dim">checking…</span>
        </div>
        <div class="actions">
          <button id="start">Start working</button>
          <button id="stop" disabled>Stop</button>
        </div>
      </section>

      <section class="card">
        <div id="stats" class="stats"></div>
        <pre id="log" class="log"></pre>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
