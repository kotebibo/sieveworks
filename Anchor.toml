[toolchain]
anchor_version = "0.30.1"

[features]
resolution = true
skip-lint = false

[programs.devnet]
sieveworks = "Sievew0rks111111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

# Devnet by default; one env var flips to mainnet (spec §9). NOT deployed yet —
# deployment is gated on explicit user approval (see repo notes).
[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
